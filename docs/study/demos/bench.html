<!DOCTYPE html>
<!-- bench.html: one or more study demos alone on a page, for building them: bench.html?files=a.js,b.js&demos=name1,name2 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo bench</title>
<style>
  body { margin: 0; padding: 16px; background: #15131c; color: #e9e6f0; font: 14px/1.4 system-ui, sans-serif; }
  .demo { max-width: 720px; margin: 0 0 32px; }
  .demo h2 { font-size: 15px; margin: 0 0 8px; }
  canvas.px { image-rendering: pixelated; display: block; background: #0e0b16; }
  .ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; }
  button { font: inherit; padding: 4px 10px; background: #2f2b4a; color: inherit; border: 1px solid #4a4566; border-radius: 4px; }
  button[aria-pressed="true"] { background: #f08d4f; color: #0e0b16; }
  .note { opacity: .7; font-size: 12px; }
</style>
</head>
<body>
<div id="list"></div>
<script src="kit.js"></script>
<script>
  // bench.html?files=a.js,b.js&demos=name1,name2 : loads the files, mounts the demos, one block each.
  const q = new URLSearchParams(location.search);
  const files = (q.get('files') || '').split(',').filter(Boolean);
  const go = () => {
    const names = (q.get('demos') || Object.keys(window.Demos).join(',')).split(',').filter(Boolean);
    for (const n of names) {
      const box = document.createElement('div'); box.className = 'demo';
      const h = document.createElement('h2'); h.textContent = n + (Demos[n] ? ' (' + Demos[n].meta.fit + ')' : '');
      const host = document.createElement('div'); host.dataset.demo = n;
      box.append(h, host); document.getElementById('list').append(box);
    }
    Kit.mountAll();
    window.__ready = true;
  };
  // one after another, in the order given, as the script tags on a page run (a demo after its group's shared file)
  const next = () => { if (!files.length) return go(); const s = document.createElement('script'); s.src = files.shift(); s.onload = s.onerror = next; document.body.append(s); };
  next();
</script>
</body>
</html>
