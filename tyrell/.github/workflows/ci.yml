name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Build and test
        run: npm test
      - name: dist/ is up to date with src/
        run: |
          git diff --exit-code -- dist || { echo "dist/ is stale: run npm run build and commit it"; exit 1; }
      - name: Voight-Kampff on Rocinante, a week
        run: node bin/voight-kampff.mjs examples/rocinante.js --days 7
