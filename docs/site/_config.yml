# The Tycho docs site, built by .github/workflows/docs.yml: the README,
# docs/, Tyrell's README and tyrell/docs/, staged at their own paths by
# scripts/stage-docs.mjs with this folder beside them. The pages stay plain
# Markdown that reads on GitHub; Jekyll (as GitHub Pages runs it) turns each
# README.md into its folder's index and each `.md` link into a link to its page.
title: Tycho
description: "An engine and a shelf of game features for small, phone-first pixel games in the browser, with Tyrell, a minds engine for games full of people, inside it."
url: https://doctorallen.github.io
baseurl: /tycho
repository: doctorallen/tycho

defaults:
  - scope:
      path: ""
    values:
      layout: default

# The side navigation: the engine's parts, then Tyrell's guides and modules.
nav:
  - title: Tycho
    pages:
      - { title: Overview, url: / }
      - { title: All the parts, url: /docs/ }
      - { title: The core, url: /docs/core.html }
      - { title: The renderer, url: /docs/renderer.html }
      - { title: Sprites, url: /docs/sprite.html }
      - { title: The painter, url: /docs/paint.html }
      - { title: Effects, url: /docs/fx.html }
      - { title: The world, url: /docs/world.html }
      - { title: Play, url: /docs/play.html }
      - { title: Harm, url: /docs/harm.html }
      - { title: The shell, url: /docs/shell.html }
      - { title: Sound, url: /docs/audio.html }
      - { title: The interface kit, url: /docs/ui.html }
      - { title: The inspector, url: /docs/inspect.html }
      - { title: The bridge, url: /docs/minds.html }
      - { title: Installable games, url: /docs/installable.html }
      - { title: The test kit, url: /docs/testkit.html }
